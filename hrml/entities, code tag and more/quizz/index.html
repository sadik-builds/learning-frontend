<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video and audio tags</title>
  </head>
  <body>
    <h1>video files</h1>
    <video src="1.mp4" controls muted width="150"></video>
    <video src="2.mp4" controls muted width="150"></video>
    <video src="3.mp4" controls muted width="150"></video>
    <video src="4.mp4" controls muted width="150"></video>
    <video src="5.mp4" controls muted width="150"></video>
    <video src="6.mp4" controls muted width="150"></video>
    <h1>audio files</h1>
    <audio src="1.mp3" controls muted></audio>
    <audio src="2.mp3" controls muted></audio>
    <audio src="3.mp3" controls muted></audio>
    <audio src="4.mp3" controls muted></audio>
    <audio src="5.mp3" controls muted></audio>
    <audio src="6.mp3" controls muted></audio>
  </body>
</html>
