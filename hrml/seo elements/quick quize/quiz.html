<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forms</title>
  </head>
  <body>
    <h1>quize form</h1>
    <form action="post">
      <div>
        <label for="name">name</label>
        <input type="text" id="name" name="name" placeholder="enter your name" autofocus />
      </div>
      <div>
        <label for="city">city</label>
        <input type="text" id="city" name="city" placeholder="enter the name your city" />
      </div>
      <div>
        <label for="pincode">pincode</label>
        <input type="number" id="pincode" name="pincode" placeholder="1100**" />
      </div>
    </form>
  </body>
</html>
