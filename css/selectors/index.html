<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css selectors</title>
    <!-- elements selector -->
    <!-- <style>div{
        background-color: red;
    } </style> -->
    <!-- class selector -->
    <style>
      .red {
        background-color: red;
      }
      #green {
        background-color: green;
      }
      div > p {
        background-color: blueviolet;
      }
    </style>

    <style>
      div p {
        background-color: rgb(0, 94, 120);
      }
      /* universal selector */
      * {
        margin: 0;
        padding: 0;
      }
      /* pseudo selector */
      a:visited {
        color: yellowgreen;
      }
      a:link {
        color: red;
      }
      a:active {
        background-color: red;
        color: blue;
      }
      a:hover {
        background-color: aqua; }
        p:first-child{
            background-color: blueviolet;
        }
     
    </style>
  </head>
  <body>
    <main class="one">
      <p>im first</p>
      <p>im second</p>
    </main>
    <div class="red">
      im a div
      <span><p>asdfghjk</p></span>
    </div>
    <div id="green">
      supppppp
      <p>qsdfghjklo</p>
    </div>
    <a href="https://www.google.com">google</a>
    <div><a href="https://www.youtube.com">youtube</a></div>
  </body>
</html>
