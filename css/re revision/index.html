<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>css selectors</title>
    <!-- <h1>style selector</h1> -->
    <style>
      /* div{
            background-color: aqua;
        } */
      /* class selector */
      .red {
        background-color: red;
      }

      #green {
        background-color: green;
      }
      div  p {
        color: blue;
        background-color: rgb(165, 165, 42);
      }
      /* univrersal selector */
      *{
        margin: 0;
        padding: 0;
      }
      /* pseudo selectors */
      a:visited{
        color: yellow;
      }

    </style>
  </head>
  <body>
    <div class="red">
      im a div
      <p>KYA HAAL HAI BHAI</p>
     
    </div>
     <a href="https://www.google.com">google</a>
    <div class="qqq">
      im a div3
      <article><p>KYA HAAL HAI BHAI2</p></article>
    </div>
    <div id="green">im a div2</div>
  </body>
</html>
