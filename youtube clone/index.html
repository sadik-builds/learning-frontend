<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="style.css" />

        <div class="pfp-1">

            Talking Tech and AI with Google CEO Sundar Pichai!

        <img class="thumbnail-2" src="thumbnail-2.webp" alt="" />

      <div class="video-info-grid">
        <div class="pfp2">
          <img
            class="profile-picture2"

            alt=""
          />

          <p class="secondtitle">Try Not To Laugh Challenge #9</p>
